<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B5F4F"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F5EBDA" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#E8A95F" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E8A95F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0E0C09"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- ── HEADER ─────────────────────────────── -->
  <text x="400" y="36" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26" font-weight="600" fill="#F5EBDA" letter-spacing="-0.5">timesfm-mcp</text>

  <text x="400" y="56" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="9.5" fill="#9C8E78" letter-spacing="3.5">MCP · TIME-SERIES FORECASTING · PYTHON</text>

  <line x1="80" y1="70" x2="720" y2="70" stroke="#E8A95F" stroke-width="0.6" opacity="0.22"/>

  <!-- ── ROW 1: MCP CLIENT ───────────────────── -->
  <text x="400" y="88" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="7.5" fill="#6B5F4F" letter-spacing="3.5">MCP CLIENT</text>

  <rect x="255" y="95" width="290" height="38" rx="6"
    fill="#171410" stroke="#3D3428" stroke-width="1"/>
  <text x="400" y="119" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="12" fill="#9C8E78">Claude · Cursor · any MCP client</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="133" x2="400" y2="153" stroke="#6B5F4F" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 2: SERVER (highlighted) ────────── -->
  <text x="400" y="170" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="7.5" fill="#E8A95F" letter-spacing="3.5" opacity="0.65">TIMESFM-MCP SERVER</text>

  <!-- Amber glow behind server box -->
  <rect x="216" y="176" width="368" height="72" rx="8" fill="#E8A95F" opacity="0.04"/>
  <!-- Server box -->
  <rect x="218" y="177" width="364" height="70" rx="7"
    fill="#1F1B16" stroke="#E8A95F" stroke-width="1.5"/>

  <!-- Status dot -->
  <circle cx="244" cy="200" r="3.5" fill="#E8A95F" opacity="0.8"/>
  <text x="256" y="204" font-family="'Courier New', monospace" font-size="9" fill="#E8A95F" opacity="0.7" letter-spacing="1">ACTIVE</text>

  <text x="400" y="204" text-anchor="middle"
    font-family="system-ui, sans-serif"
    font-size="15" font-weight="600" fill="#F5EBDA">timesfm-mcp · FastMCP</text>

  <!-- Tool badges inside server box -->
  <rect x="280" y="212" width="80" height="22" rx="4" fill="#0E0C09" stroke="#C97B3F" stroke-width="0.8"/>
  <text x="320" y="227" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="9" fill="#C97B3F">forecast</text>

  <rect x="440" y="212" width="80" height="22" rx="4" fill="#0E0C09" stroke="#C97B3F" stroke-width="0.8"/>
  <text x="480" y="227" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="9" fill="#C97B3F">backtest</text>

  <!-- Fork arrows -->
  <!-- Vertical stem down from server -->
  <line x1="400" y1="247" x2="400" y2="265" stroke="#6B5F4F" stroke-width="1.5"/>
  <!-- Horizontal branch -->
  <line x1="220" y1="265" x2="580" y2="265" stroke="#6B5F4F" stroke-width="1.5"/>
  <!-- Left drop -->
  <line x1="220" y1="265" x2="220" y2="285" stroke="#6B5F4F" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Right drop -->
  <line x1="580" y1="265" x2="580" y2="285" stroke="#6B5F4F" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 3: BACKENDS ─────────────────────── -->
  <!-- Left: NumPy Baseline (solid green = always on) -->
  <rect x="80" y="285" width="275" height="72" rx="7"
    fill="#171410" stroke="#7FB069" stroke-width="1.5"/>
  <circle cx="106" cy="308" r="3.5" fill="#7FB069"/>
  <text x="122" y="312" font-family="'Courier New', monospace" font-size="8" fill="#7FB069" letter-spacing="1">ALWAYS ON</text>
  <text x="218" y="332" text-anchor="middle"
    font-family="system-ui, sans-serif"
    font-size="13" font-weight="600" fill="#F5EBDA">NumPy Baseline</text>
  <text x="218" y="348" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="9" fill="#9C8E78">pure Python · no GPU</text>

  <!-- Right: TimesFM 2.5 (dashed = optional) -->
  <rect x="445" y="285" width="275" height="72" rx="7"
    fill="#171410" stroke="#6B5F4F" stroke-width="1.5" stroke-dasharray="6 3"/>
  <circle cx="471" cy="308" r="3.5" fill="#6B5F4F"/>
  <text x="487" y="312" font-family="'Courier New', monospace" font-size="8" fill="#6B5F4F" letter-spacing="1">OPTIONAL</text>
  <text x="582" y="332" text-anchor="middle"
    font-family="system-ui, sans-serif"
    font-size="13" font-weight="600" fill="#F5EBDA">TimesFM 2.5</text>
  <text x="582" y="348" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="9" fill="#9C8E78">vendored · #432 tracked</text>

  <!-- Merge arrows from backends to output -->
  <line x1="218" y1="357" x2="218" y2="378" stroke="#6B5F4F" stroke-width="1.5"/>
  <line x1="582" y1="357" x2="582" y2="378" stroke="#6B5F4F" stroke-width="1.5"/>
  <line x1="218" y1="378" x2="582" y2="378" stroke="#6B5F4F" stroke-width="1.5"/>
  <line x1="400" y1="378" x2="400" y2="395" stroke="#6B5F4F" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── OUTPUT STRIP ────────────────────────── -->
  <rect x="80" y="400" width="640" height="30" rx="5"
    fill="#171410" stroke="#3D3428" stroke-width="1"/>
  <text x="400" y="419" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="9" fill="#6B5F4F" letter-spacing="1.5">point predictions · confidence bands · trend · seasonality</text>

</svg>
